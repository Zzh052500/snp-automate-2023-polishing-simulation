# 极限稀疏模式：确保 Descartes 能完成计算
# 适用于大面积全工件打磨（牺牲覆盖密度换取可行性）
# 参考：docs/Polish_Planning_Optimization.md

mesh_modifiers:
  - name: ROISelection
    max_cluster_size: 1000000000
    min_cluster_size: 5
    cluster_tolerance: 0.012
    plane_distance_threshold: 0.012
  - name: NormalsFromMeshFaces

tool_path_planner:
  name: PlaneSlicerLegacy
  direction_generator:
    name: LocatedVectorDirection
    service_name: get_located_vector
  origin_generator:
    name: Centroid
  # 线间距：6cm（文档推荐的大面积配置）
  # 效果：40cm 宽度约 6-7 条线
  line_spacing: 0.06
  # 点间距：6cm（初始采样）
  point_spacing: 0.06
  # 最小孔洞尺寸：忽略小于 18cm 的孔洞
  min_hole_size: 0.18
  # 最小线段长度：过滤短于 18cm 的线段
  min_segment_size: 0.18
  bidirectional: true

tool_path_modifiers:
  - name: MovingAverageOrientationSmoothing
    window_size: 5
  - name: UniformSpacing
    # 最终点间距：4.5cm（文档推荐值 2.5cm 的稍微保守版）
    # 效果：40cm 长度约 8-9 个点
    point_spacing: 0.045
    spline_degree: 2
    include_endpoints: false
  - name: SnakeOrganization
