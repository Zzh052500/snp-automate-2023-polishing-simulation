joint_names: ['joint1', 'joint2', 'joint3', 'joint4', 'joint5', 'joint6']
# 时间戳一律用整秒（nanosec 全 0）。
# 原因：snp_application 的 ExtractApproachProcessDepartureTrajectories 节点在切片时用
#   pt.time_from_start.nanosec -= start->time_from_start.nanosec;
# 做偏移，而 builtin_interfaces/Duration.nanosec 是 **uint32**。
# 一旦某点的 nanosec 小于该子轨迹起点的 nanosec 就会回绕，且 sec 不借位，
# 结果时间戳倒退、被 JTC 以 "Time between points N and N+1 is not strictly increasing" 拒收。
# 全 0 之后任何起点都满足 nanosec >= 0，彻底规避。
#
# 时间安排（整秒）：P1=0，P2..P9 每步 1s，P10=13s，总时长 13s。
# 单步最大关节变化 14.2° / 1s = 14.2°/s，关节限速 180°/s，约 8% 上限，余量充足。
