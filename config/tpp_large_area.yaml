# 大面积打磨路径规划配置（优化版）
# 适用于 20cm × 20cm 或更大的打磨区域
# 通过增大线/点间距减少路径点数，提高规划成功率

mesh_modifiers:
  - name: ROISelection
    max_cluster_size: 1000000000
    min_cluster_size: 5
    cluster_tolerance: 0.012
    plane_distance_threshold: 0.012
  - name: NormalsFromMeshFaces

tool_path_planner:
  name: PlaneSlicerLegacy
  direction_generator:
    name: LocatedVectorDirection
    service_name: get_located_vector
  origin_generator:
    name: Centroid
  # 线间距：从 3cm 增大到 5cm
  # 效果：20cm 宽度从 7 条线减少到 4 条线
  line_spacing: 0.05
  # 点间距：从 3cm 增大到 5cm（会被 UniformSpacing 进一步调整）
  point_spacing: 0.05
  # 最小孔洞尺寸：忽略小于 15cm 的孔洞
  min_hole_size: 0.15
  # 最小线段长度：过滤短于 15cm 的线段
  min_segment_size: 0.15
  bidirectional: true

tool_path_modifiers:
  - name: MovingAverageOrientationSmoothing
    window_size: 5
  - name: UniformSpacing
    # 最终点间距：从 1.5cm 增大到 2.5cm
    # 效果：20cm 长度从 13 个点减少到 8 个点
    point_spacing: 0.025
    spline_degree: 2
    include_endpoints: false
  - name: SnakeOrganization
